<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battle English Match</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;min-height:100vh;background:#10223a}.top{padding:10px 12px;background:#07111fe8;display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-weight:1000;font-size:clamp(22px,6vw,36px)}.title span{color:#ffd83d}.hud{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#203b5e;border:2px solid #ffffff33;border-radius:20px;padding:6px 9px;font-weight:900}.scene{height:210px;position:relative;background:center/cover no-repeat;overflow:hidden;border-bottom:3px solid #ffd83d}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#10223acc,transparent 65%)}.phase{position:absolute;z-index:2;left:10px;top:10px;background:#06101dcc;padding:7px 10px;border-radius:9px;font-weight:900;font-size:13px}.hero{position:absolute;z-index:3;left:7%;bottom:-8px;width:105px;height:150px;object-fit:contain;filter:drop-shadow(0 5px 5px #000)}.enemy{position:absolute;z-index:3;right:9%;bottom:35px;font-size:64px;filter:drop-shadow(0 5px 5px #000)}.enemy.hit{animation:hit .25s}@keyframes hit{50%{transform:translateX(18px) rotate(10deg);opacity:.45}}.ehp{position:absolute;z-index:4;right:6%;bottom:18px;width:110px;height:10px;background:#3b1111;border-radius:9px;overflow:hidden;border:1px solid #fff8}.ehp i{display:block;height:100%;background:#ff3d32}.goal{padding:8px 12px;background:#18304e;display:flex;justify-content:space-between;align-items:center;font-weight:900}.mission{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 10px;background:#0b315d;border-bottom:3px solid #f3b51b}.targetBox,.movesBox{background:#fff3c9;color:#173557;border:3px solid #f0a91b;border-radius:15px;padding:7px 12px;font-weight:1000;box-shadow:inset 0 0 0 2px #fff}.targetBox{display:flex;align-items:center;gap:10px}.targetIcons{display:flex;gap:8px;font-size:23px}.movesBox{text-align:center;min-width:92px}.movesBox b{display:block;font-size:28px}.boosterDock{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px;background:#f4f6f8;border-top:3px solid #f0a91b}.boosterDock button{min-width:0;min-height:70px;border-radius:14px;border:2px solid #d9dde2;background:#fff;color:#172238;font-size:11px;font-weight:1000;box-shadow:0 3px 8px #0002;padding:7px 3px;position:relative}.boosterDock button .ico{display:block;font-size:24px;margin-bottom:3px}.boosterDock small{position:absolute;right:3px;top:3px;background:#ffd83d;color:#173557;border-radius:10px;padding:1px 4px;font-size:10px;font-weight:1000}.boardWrap{padding:10px;background:linear-gradient(#17406b,#0b2747)}.board{width:min(94vw,600px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:#061525aa;border:4px solid #d5ecff;border-radius:18px;padding:6px;box-shadow:0 8px 22px #0008}.tile{border:0;touch-action:none;-webkit-user-select:none;user-select:none;border-radius:13px;font-size:clamp(22px,7vw,43px);display:grid;place-items:center;background:#ffffff15;box-shadow:inset 0 -5px #0003;transition:transform .13s}.tile.sel{outline:4px solid #fff;transform:scale(.9)}.tile.pop{transform:scale(.15) rotate(20deg)}.tile.blocked{background:#36475a;font-size:clamp(20px,6vw,38px);box-shadow:inset 0 0 0 3px #8aa0b5,inset 0 -5px #0005}.tile.blocked.glass{background:linear-gradient(135deg,#dff8ff99,#79d8ff55);box-shadow:inset 0 0 0 3px #e9fbff,inset 0 -5px #4da9c766}.tile.blocked.glass:after{content:'✧';position:absolute;font-size:18px;color:white}.tile.blocked.crack{animation:crack .25s}@keyframes crack{50%{transform:scale(.86) rotate(-5deg)}}.bottom{display:flex;justify-content:space-around;gap:8px;padding:10px;background:#07111f}.bottom button{border:0;border-radius:14px;padding:10px 13px;font-weight:900;background:#ffd83d;color:#182238}.modal{display:none;position:fixed;z-index:30;inset:0;background:#03101beF;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.card{width:min(620px,96vw);background:#173557;border:3px solid #ffd83d;border-radius:20px;padding:18px;text-align:center}.answers{display:grid;gap:9px}.answers button{padding:14px;border:0;border-radius:12px;background:#e9f5ff;color:#10223a;font-size:17px;font-weight:800}.shopitem{display:flex;justify-content:space-between;align-items:center;margin:8px 0;background:#0d243e;padding:10px;border-radius:12px}.shopitem button{background:#ffd83d;border:0;border-radius:10px;padding:9px;font-weight:900}.toast{position:fixed;z-index:50;left:50%;bottom:20px;transform:translateX(-50%);background:#06101ded;padding:10px 16px;border-radius:20px;font-weight:900;pointer-events:none;opacity:0;transition:.2s}.toast.on{opacity:1}.coin{position:absolute;z-index:8;font-size:30px;animation:coin .7s ease forwards}@keyframes coin{to{transform:translate(-90px,-80px) scale(.4);opacity:0}}@media(max-width:500px){.scene{height:175px}.hero{width:85px;height:125px}.enemy{font-size:50px}.board{gap:3px;padding:5px}.top{align-items:flex-start}.pill{font-size:12px;padding:5px 7px}}
</style></head><body><div class="app"><header class="top"><div class="title">BATTLE <span>ENGLISH</span></div><div class="hud"><div class="pill">❤️ <span id="hp">100</span></div><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">⭐ <span id="xp">0</span></div></div></header><section id="scene" class="scene"><div id="phase" class="phase"></div><img id="hero" class="hero" src="sprites/01_front_idle.png"><div id="enemy" class="enemy">🤖</div><div class="ehp"><i id="ehp"></i></div></section><div class="mission"><div class="targetBox"><b>ALVO</b><div class="targetIcons">🪟 <span id="obgoal">0</span> &nbsp; 🤖</div><span id="difficulty"></span></div><div class="movesBox">JOGADAS<b id="moves">20</b></div></div><div class="boardWrap"><div id="board" class="board"></div></div><div class="boosterDock"><button id="hammer"><span class="ico">☑️</span>ALUNO<br>PRESENTE<small id="hammers">1</small></button><button id="shuffle"><span class="ico">🏫</span>SALA DO<br>FUTURO</button><button id="rocket"><span class="ico">🗣️</span>SPEAK<small>4+</small></button><button id="cannon"><span class="ico">📋</span>TAREFAS<small>5+</small></button></div></div>
<div id="quiz" class="modal"><div class="card"><h2>🏆 INIMIGO DERRUBADO!</h2><h3 id="question"></h3><div id="answers" class="answers"></div></div></div>
<div id="store" class="modal"><div class="card"><h2>🛒 ARSENAL</h2><p>Use suas moedas para fortalecer os ataques.</p><div class="shopitem"><b>🔫 Rifle — dano +1</b><button data-buy="Rifle" data-cost="35" data-power="1">35 🪙</button></div><div class="shopitem"><b>⚡ Blaster — dano +2</b><button data-buy="Blaster" data-cost="75" data-power="2">75 🪙</button></div><div class="shopitem"><b>💥 Canhão — dano +3</b><button data-buy="Canhão" data-cost="130" data-power="3">130 🪙</button></div><button id="close">VOLTAR</button></div></div><div id="toast" class="toast"></div><script>
const Q=[['House significa:',['Casa','Hotel','Escola'],0],['Choose the color: vermelho',['Blue','Red','Green'],1],['Where do you study?',['Hospital','School','Park'],1],['There ___ two soldiers near the building.',['is','are','am'],1],['If the road is dangerous, you should ___ another way.',['find','give','make'],0],['She ___ my friend.',['am','is','are'],1],['I ___ English every day.',['study','studies','studying'],0],['They are ___.',['student','students','studys'],1],['Does he ___ here?',['lives','live','living'],1],['Choose the correct sentence.',['He go to school.','He goes to school.','He going school.'],1],['STOP means:',['Pare','Corra','Entre'],0],['Turn left means:',['Vire à direita','Vire à esquerda','Volte'],1],['KEEP OUT means:',['Entre','Mantenha-se afastado','Espere'],1],['Danger ahead means:',['Perigo à frente','Uma escola','Comida'],0],['EXIT means:',['Saída','Entrada','Arma'],0],['Good morning!',['Boa noite!','Bom dia!','Até logo!'],1],['Where are you?',['Onde você está?','Quem é você?','Como você está?'],0],['I need help.',['Eu preciso de ajuda.','Eu tenho fome.','Eu vou embora.'],0],['Can you help me?',['Yes, I can.','Yes, I am.','Yes, I do help me.'],0],['Cross the bridge carefully.',['Atravesse a ponte com cuidado.','Quebre a ponte.','Corra da ponte.'],0],['Actually means:',['Atualmente','Na verdade','Atual'],1],['Parents means:',['Parentes','Pais','Primos'],1],['Pretend means:',['Pretender','Fingir','Entender'],1],['Eventually means:',['Eventualmente','Finalmente','Possivelmente'],1],['English opens new horizons.',['O inglês abre novos horizontes.','O inglês fecha caminhos.','O inglês é um lugar.'],0]];
const phases=[['FASE 1 — RUÍNAS','sprites/fase_01_manha_ruinas.png','🤖'],['FASE 2 — ZONA DE CONFLITO','sprites/fase_02_tarde_zona_conflito.png','🥷'],['FASE 3 — BASE SECRETA','sprites/fase_03_noite_base_militar.png','👾'],['FASE 4 — PONTE DA ESPERANÇA','sprites/fase_04_amanhecer_ponte_esperanca.png','🤖'],['FASE 5 — A REDENÇÃO','sprites/fase_05_a_redencao.png','💀']];
const icons=['🔷','🔶','💚','⭐','🔴','🟣'];const difficulty=[{name:'FÁCIL',moves:24,hp:14,types:5},{name:'NORMAL',moves:22,hp:20,types:6},{name:'DIFÍCIL',moves:20,hp:28,types:6},{name:'MUITO DIFÍCIL',moves:18,hp:36,types:6},{name:'CHEFE FINAL',moves:16,hp:48,types:6}];let grid=[],blocks={},sel=null,n=0,hp=100,xp=0,coins=0,moves=24,enemyHP=14,enemyMax=14,power=0,locked=false,hammers=1,dragStart=null;
const $=id=>document.getElementById(id),idx=(r,c)=>r*8+c,rc=i=>[Math.floor(i/8),i%8];
function phase(){return Math.min(4,Math.floor(n/5))}function toast(t){$('toast').textContent=t;$('toast').className='toast on';setTimeout(()=>$('toast').className='toast',1200)}
function makeBlocks(){blocks={};let count=10;while(Object.keys(blocks).length<count){let i=8+Math.floor(Math.random()*48);blocks[i]=3}}function fresh(){grid=[];let types=difficulty[phase()].types;for(let i=0;i<64;i++){let v;do{v=Math.floor(Math.random()*types)}while((i%8>1&&grid[i-1]===v&&grid[i-2]===v)||(i>15&&grid[i-8]===v&&grid[i-16]===v));grid.push(v)}makeBlocks();render()}
function render(){const b=$('board');b.style.display='grid';b.innerHTML='';if(!grid||grid.length!==64){grid=[];for(let i=0;i<64;i++)grid.push(Math.floor(Math.random()*icons.length))}grid.forEach((v,i)=>{if(v===undefined||v===null||!icons[v])v=grid[i]=Math.floor(Math.random()*icons.length);let x=document.createElement('button');if(blocks[i]){x.className='tile blocked'+(blocks[i]===3?' glass':'');x.textContent=blocks[i]===3?'🪟':blocks[i]>1?'🧱':'📦';x.disabled=true;b.appendChild(x);return}x.className='tile'+(sel===i?' sel':'');x.textContent=icons[v];x.dataset.i=i;x.addEventListener('pointerdown',e=>{dragStart={i,x:e.clientX,y:e.clientY};x.setPointerCapture&&x.setPointerCapture(e.pointerId)});x.addEventListener('pointerup',e=>{if(!dragStart)return;let dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y,from=dragStart.i;dragStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<18){tap(from);return}let r=Math.floor(from/8),cc=from%8,to=from;if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&cc<7)to=from+1;else if(dx<0&&cc>0)to=from-1}else{if(dy>0&&r<7)to=from+8;else if(dy<0&&r>0)to=from-8}if(to!==from)swapTouch(from,to)});b.appendChild(x)});hud()}
function ensureBoard(){if(!Array.isArray(grid)||grid.length!==64){fresh();return false}return true}function hud(){let p=phase(),ph=phases[p];$('scene').style.backgroundColor='#17324d';$('scene').style.backgroundImage="url('"+ph[1]+"?v=approved2')";$('phase').textContent=ph[0]+' • DESAFIO '+(n+1)+'/25';$('enemy').textContent=ph[2];$('hp').textContent=hp;$('xp').textContent=xp;$('coins').textContent=coins;$('moves').textContent=moves;$('difficulty').textContent=difficulty[p].name;$('obgoal').textContent=Object.keys(blocks).length;$('hammers').textContent=hammers;$('ehp').style.width=Math.max(0,enemyHP/enemyMax*100)+'%'}
function swapTouch(a,i){if(locked||!adjacent(a,i))return;sel=null;[grid[a],grid[i]]=[grid[i],grid[a]];let m=matches();if(!m.size){[grid[a],grid[i]]=[grid[i],grid[a]];toast('Sem combinação');render();return}moves--;resolve(m)}function adjacent(a,b){let A=rc(a),B=rc(b);return Math.abs(A[0]-B[0])+Math.abs(A[1]-B[1])===1}
function tap(i){if(locked)return;if(sel===null){sel=i;render();return}if(sel===i){sel=null;render();return}if(!adjacent(sel,i)){sel=i;render();return}let a=sel;sel=null;[grid[a],grid[i]]=[grid[i],grid[a]];let m=matches();if(!m.size){[grid[a],grid[i]]=[grid[i],grid[a]];toast('Faça uma combinação de 3 ou mais!');render();return}moves--;resolve(m)}
function damageBlocks(m){let hit=new Set;for(let i of m){let r=Math.floor(i/8),cc=i%8;[[r-1,cc],[r+1,cc],[r,cc-1],[r,cc+1]].forEach(a=>{if(a[0]>=0&&a[0]<8&&a[1]>=0&&a[1]<8){let j=a[0]*8+a[1];if(blocks[j])hit.add(j)}})}hit.forEach(j=>{if(blocks[j]===3){blocks[j]=0;toast('💎 CRASH! Vidro quebrado!')}else blocks[j]--;if(blocks[j]<=0){delete blocks[j];coins+=2}else{let t=$('board').children[j];if(t)t.classList.add('crack')}});return hit.size}function matches(){let s=new Set;for(let r=0;r<8;r++){for(let c=0;c<6;c++){let a=idx(r,c);if(grid[a]===grid[a+1]&&grid[a]===grid[a+2]){let k=c;while(k<8&&grid[idx(r,k)]===grid[a])s.add(idx(r,k++))}}}for(let c=0;c<8;c++){for(let r=0;r<6;r++){let a=idx(r,c);if(grid[a]===grid[a+8]&&grid[a]===grid[a+16]){let k=r;while(k<8&&grid[idx(k,c)]===grid[a])s.add(idx(k++,c))}}}return s}
function resolve(m){locked=true;let smashed=damageBlocks(m);let dmg=Math.max(1,Math.floor(m.size/3))+power,bonus=m.size>=5?5:0;if(m.size>=4){hammers++;toast('🔨 COMBO DE 4! Item destruidor conquistado!')}coins+=m.size+bonus;enemyHP-=dmg;$('enemy').className='enemy hit';$('hero').src='sprites/21_attack_shoot.png?v=match1';[...m].forEach(i=>{let t=$('board').children[i];if(t)t.classList.add('pop')});toast((smashed?'💥 '+smashed+' obstáculo(s) atingido(s) • ':'')+'⚔️ '+dmg+' dano • 🪙 +'+(m.size+bonus));setTimeout(()=>{for(let i of m)grid[i]=Math.floor(Math.random()*icons.length);$('enemy').className='enemy';$('hero').src='sprites/01_front_idle.png?v=match1';cascade()},260)}
function cascade(){let m=matches();if(m.size){for(let i of m)grid[i]=Math.floor(Math.random()*icons.length);render();setTimeout(cascade,140);return}locked=false;render();if(Object.keys(blocks).length===0){enemyHP=0;dropCoin();toast('🏆 Todos os vidros foram destruídos!');setTimeout(openQuiz,350);return}if(enemyHP<=0){enemyHP=1;toast('🪟 Quebre os 10 vidros para concluir!')}if(moves<=0){locked=true;setTimeout(function(){if(confirm('Jogadas acabaram! Usar 20 moedas para ganhar +5 jogadas?')&&coins>=20){coins-=20;moves=5;locked=false;render()}else{hp-=10;moves=difficulty[phase()].moves;if(hp<=0)hp=100;locked=false;fresh();toast('❤️ -10 HP • nível reiniciado')}},100)}}
function dropCoin(){let c=document.createElement('div');c.className='coin';c.textContent='🪙';c.style.right='16%';c.style.bottom='55px';$('scene').appendChild(c);coins+=10+phase()*3;hud();setTimeout(()=>c.remove(),700)}
function openQuiz(){locked=true;let q=Q[n];$('question').textContent=q[0];let a=$('answers');a.innerHTML='';q[1].forEach((v,i)=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>answer(i);a.appendChild(b)});$('quiz').className='modal show'}
function answer(i){let q=Q[n];if(i===q[2]){xp+=15;coins+=10;n++;$('quiz').className='modal';if(n>=25){$('quiz').innerHTML='<div class="card"><img src="sprites/25_victory.png" style="max-width:70%;max-height:260px"><h1>🏆 MISSÃO COMPLETA!</h1><h2>English opens new horizons!</h2></div>';$('quiz').className='modal show';return}moves=difficulty[phase()].moves;enemyMax=difficulty[phase()].hp;enemyHP=enemyMax;locked=false;$('enemy').style.display='block';$('enemy').className='enemy';$('hero').style.display='block';$('board').style.display='grid';fresh();hud();toast('✅ Correto! Próximo desafio! +15 XP +10 🪙')}else{hp-=10;toast('❌ Tente novamente • ❤️ -10');$('quiz').className='modal show';hud()}}
$('shuffle').onclick=()=>{if(locked)return;fresh();toast('🏫 Sala do Futuro: tabuleiro renovado!')};$('hammer').onclick=()=>{if(locked||hammers<1)return;let ids=Object.keys(blocks);if(!ids.length)return;hammers--;delete blocks[ids[Math.floor(Math.random()*ids.length)]];render();toast('☑️ Aluno Presente: vidro eliminado!');if(Object.keys(blocks).length===0){locked=true;dropCoin();setTimeout(openQuiz,350)}};$('rocket').onclick=()=>toast('🗣️ SPEAK • faça 4 iguais para ganhar um item destruidor');$('cannon').onclick=()=>toast('📋 TAREFAS • faça 5+ iguais para um supercombo');fresh();
</script></body></html>
