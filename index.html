<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Battle English</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#07121f;color:#fff}.wrap{max-width:920px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-size:clamp(28px,7vw,54px);font-weight:1000}.brand b{color:#ffd21c}.hud{display:flex;gap:8px}.pill{background:#14243a;border:1px solid #2e4768;padding:9px 12px;border-radius:12px}.mission{margin:14px 0;background:#101d31;border-left:5px solid #ffd21c;padding:12px;border-radius:10px}.game{position:relative;aspect-ratio:16/10;max-height:620px;overflow:hidden;border:2px solid #304a69;border-radius:18px;background:#628f4a}.road{position:absolute;background:#c7a46e}.h{left:0;right:0;top:44%;height:13%}.v{top:0;bottom:0;left:48%;width:10%}.place{position:absolute;padding:10px;border-radius:12px;background:#e5dfcf;color:#17202b;font-weight:900;border:3px solid #34465c;text-align:center}.school{left:5%;top:8%}.market{right:5%;top:8%;background:#e0b768}.forest{left:5%;bottom:8%;background:#315e35;color:#fff}.station{right:5%;bottom:8%;background:#aebdca}.chest{left:48%;top:16%;background:#e6a81f}.npc{right:29%;top:27%;background:#6689c6;color:#fff}.player{position:absolute;left:48%;top:78%;font-size:34px;transition:.12s;transform:translate(-50%,-50%)}.controls{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center;margin:16px auto}.controls button,.action{min-height:52px;border:0;border-radius:13px;font-size:20px;font-weight:900}.controls button{background:#dbe4ef}.action{background:#ffd21c}.log{background:#101d31;border:1px solid #2e4768;padding:12px;border-radius:12px}.modal{position:absolute;inset:10%;background:#0b1728f2;border:2px solid #5b7391;border-radius:16px;padding:18px;display:none;overflow:auto}.modal.show{display:block}.answers{display:grid;gap:8px}.answers button{padding:12px;border-radius:10px;border:1px solid #47617f;background:#172a44;color:#fff;text-align:left;font-size:16px}.small{color:#adbed0}
</style></head>
<body><main class="wrap">
<div class="top"><div class="brand">BATTLE <b>ENGLISH</b></div><div class="hud"><span class="pill">❤️ <b id="hp">100</b></span><span class="pill">⭐ <b id="xp">0</b> XP</span><span class="pill">🔑 <b id="keys">0</b></span></div></div>
<div class="mission" id="mission"><b>MISSÃO 01:</b> Explore o mapa e encontre a School.</div>
<section class="game" id="game"><div class="road h"></div><div class="road v"></div><div class="place school">🏫<br>SCHOOL</div><div class="place market">🏪<br>MARKET</div><div class="place forest">🌲<br>FOREST</div><div class="place station">🚉<br>STATION</div><div class="place chest">📦</div><div class="place npc">🧑 ALEX</div><div class="player" id="player">🧑‍🚀</div><div class="modal" id="modal"><h2 id="mt"></h2><p id="mq"></p><div class="answers" id="answers"></div><button class="action" id="close" style="margin-top:12px">Fechar</button></div></section>
<div class="controls"><i></i><button data-d="u">▲</button><i></i><button data-d="l">◀</button><button class="action" id="act">A</button><button data-d="r">▶</button><i></i><button data-d="d">▼</button></div>
<div class="log"><b>📜 Diário:</b> <span id="log">Você chegou à Battle Island. Ande pelo mapa e aproxime-se dos locais.</span><div class="small">No celular: use as setas e toque em A para interagir.</div></div>
</main>
<script>
let x=48,y=78,hp=100,xp=0,keys=0,done={};const p=document.querySelector('#player'),modal=document.querySelector('#modal'),log=document.querySelector('#log'),mission=document.querySelector('#mission');
const spots={school:[12,18],market:[86,18],forest:[12,78],station:[86,78],chest:[51,23],npc:[70,34]};
function draw(){p.style.left=x+'%';p.style.top=y+'%'}function stat(){hp=Math.max(0,hp);document.querySelector('#hp').textContent=hp;document.querySelector('#xp').textContent=xp;document.querySelector('#keys').textContent=keys}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(modal.classList.contains('show'))return;let d=b.dataset.d;if(d==='u')y-=5;if(d==='d')y+=5;if(d==='l')x-=5;if(d==='r')x+=5;x=Math.max(3,Math.min(97,x));y=Math.max(5,Math.min(94,y));draw()});
function nearest(){let best=null,bd=99;for(const [k,v] of Object.entries(spots)){let d=Math.hypot(x-v[0],y-v[1]);if(d<13&&d<bd){best=k;bd=d}}return best}
function quiz(title,q,opts,correct,onWin){document.querySelector('#mt').textContent=title;document.querySelector('#mq').textContent=q;let a=document.querySelector('#answers');a.innerHTML='';opts.forEach((o,i)=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(i===correct){xp+=20;stat();log.textContent='Acertou! +20 XP.';modal.classList.remove('show');onWin()}else{hp-=10;stat();log.textContent='Resposta incorreta. -10 HP.'}};a.appendChild(b)});modal.classList.add('show')}
document.querySelector('#close').onclick=()=>modal.classList.remove('show');
document.querySelector('#act').onclick=()=>{let s=nearest();if(!s){log.textContent='Chegue mais perto de um local, personagem ou objeto.';return}
if(s==='school')quiz('🏫 School — Grammar Gate','She ___ my best friend.',['am','are','is','be'],2,()=>{done.school=1;mission.innerHTML='<b>MISSÃO 02:</b> Encontre Alex perto da estrada.'});
if(s==='npc'){if(!done.school){log.textContent='Primeiro conclua a School.';return}quiz('🧑 Alex','What does “I need help” mean?',['Eu preciso de ajuda.','Eu gosto de ajudar.','Eu estou perdido.','Eu quero comida.'],0,()=>{done.npc=1;keys++;stat();mission.innerHTML='<b>MISSÃO 03:</b> Vá ao Market.'})}
if(s==='market'){if(!done.npc){log.textContent='Fale com Alex primeiro.';return}quiz('🏪 Market','Como pedir água educadamente?',['Can I have some water, please?','Where is my teacher?','I play soccer.','This is my classroom.'],0,()=>{done.market=1;mission.innerHTML='<b>MISSÃO 04:</b> Explore a Forest.'})}
if(s==='forest'){if(!done.market){log.textContent='Conclua o Market primeiro.';return}quiz('🌲 Forest','A placa diz “DANGER! DO NOT ENTER.” O que fazer?',['Não entrar.','Entrar rápido.','Sentar.','Abrir a porta.'],0,()=>{done.forest=1;mission.innerHTML='<b>MISSÃO 05:</b> Abra a Mystery Box.'})}
if(s==='chest'){if(!done.forest){log.textContent='Você precisa da pista da Forest.';return}quiz('📦 Mystery Box','They ___ my friends.',['is','am','are','be'],2,()=>{done.chest=1;keys++;stat();mission.innerHTML='<b>FINAL:</b> Chegue à Station.'})}
if(s==='station'){if(!done.chest){log.textContent='Conclua as missões anteriores.';return}quiz('🚉 Final Gate','Qual pergunta significa “Quantos anos você tem?”',['How old are you?','How are you old?','What old are you?','Where old are you?'],0,()=>{xp+=30;stat();done.station=1;mission.innerHTML='<b>🏆 MISSÃO COMPLETA!</b> Battle Island liberada.';log.textContent='Você venceu o protótipo! Próxima atualização: sprites, novos mapas e missões.'})}};
draw();stat();
</script></body></html>
